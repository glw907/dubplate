name: fuzz

# A timed fuzz run on each pull request that touches a fuzz target or a
# fuzzed package. The seeds alone already run in every `go test`; this
# run searches beyond them. It has no schedule, so it never fails between
# sittings with nobody watching.
on:
  pull_request:
    paths:
      - internal/engine/tagio/**
      - internal/intake/gate/**
      - .github/workflows/fuzz.yml
      - Makefile

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4

      - name: Fuzz each target
        run: make fuzz FUZZTIME=1m

      # A failing target writes its crashing input under the package's
      # testdata/fuzz. The input joins the seed corpus once its cause is
      # fixed.
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: |
            internal/engine/tagio/testdata/fuzz/
            internal/intake/gate/testdata/fuzz/
          if-no-files-found: warn

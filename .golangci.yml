version: "2"

# Two worktrees linting at once wait for each other instead of the second
# exiting with "parallel golangci-lint is running".
run:
  allow-serial-runners: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - modernize
    - misspell
    - unparam
    - dupl
    - gocognit
    - forbidigo
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 30
    forbidigo:
      # The clock reaches a package as a Now function in its
      # configuration (docs/decisions/0014-clock-reaches-packages-as-now.md),
      # and every subprocess runs under exec.CommandContext.
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until)$
          msg: take the time from a Now function in the package's configuration.
        - pattern: ^exec\.Command$
          msg: use exec.CommandContext.
    errcheck:
      check-type-assertions: true
    unused:
      # An exported struct field nothing reads is dead weight, and the
      # default treats every exported field as used. The identifier-level
      # half of the same rule, an exported func, type or const under
      # internal/ with no consumer outside its own file and its tests,
      # cannot be expressed here: unused's exported-is-used setting is
      # gone in the pinned golangci-lint 2.x, which rejects the key
      # outright, so scripts/check.sh carries that leg instead.
      exported-fields-are-used: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocognit
          - forbidigo
      # cmd/ and tools/ wire the clock into packages, and the test
      # harness reads it directly.
      - path: ^(cmd|tools|internal/harness)/
        linters:
          - forbidigo
        text: time\.
      # Functions over the complexity bar when the check was adopted.
      # This list only shrinks: a function leaves it when it is
      # refactored, and no new function joins it.
      - path: ^internal/harness/analysis/album_info\.go$
        linters:
          - gocognit
        text: func `CheckAlbumInfoLedger`
      - path: ^internal/harness/conform/case\.go$
        linters:
          - gocognit
        text: func `gradeCaseDefault`
      - path: ^internal/harness/subsonic/fixture/manifest\.go$
        linters:
          - gocognit
        text: func `\(\*Library\)\.check`
      - path: ^internal/harness/subsonic/grade/assignment\.go$
        linters:
          - gocognit
        text: func `\(\*assignment\)\.problems`
      - path: ^internal/harness/subsonic/session/session\.go$
        linters:
          - gocognit
        text: func `\(\*Session\)\.validate`
      - path: ^internal/harness/subsonic/xmlrule/project\.go$
        linters:
          - gocognit
        text: func `\(\*schema\)\.project`
      - path: ^internal/intake/accept\.go$
        linters:
          - gocognit
        text: func `\(\*submissions\)\.commitVerdict`
      - path: ^internal/intake/gate/zip\.go$
        linters:
          - gocognit
        text: func `walkZIP`
      - path: ^internal/store/swap\.go$
        linters:
          - gocognit
        text: func `\(leaf\)\.swapPlan`

formatters:
  enable:
    - gofmt
    - goimports

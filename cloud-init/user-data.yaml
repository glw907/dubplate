#cloud-config
# musicbox first-boot config for AlmaLinux 10. SELinux stays enforcing throughout;
# nothing here calls setenforce or edits /etc/selinux/config.

# Only the users listed below are created. Omitting the "default" entry means
# cloud-init does not also create a distro default user.
disable_root: false
ssh_pwauth: false

users:
  - name: root
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGRjkroBDeqUur67LcPZ5KX3uoLm3vzBTfKFVcOBcGxC geoff@907.life

# e2fsprogs provides mkfs.ext4/blkid; present on a full AlmaLinux install already,
# listed here so a minimal image still has the volume-formatting tools. jq is
# music-import's JSON filter over yq's YAML->JSON output (Task 2); yq itself
# (mikefarah/go, v4) is not in AlmaLinux's repos and is installed below via a
# pinned, checksum-verified GitHub release instead.
packages:
  - e2fsprogs
  - jq

write_files:
  # cloud-init.service is ordered Before=sshd.service, so this drop-in is already
  # in place the first time sshd starts; no reload needed.
  - path: /etc/ssh/sshd_config.d/60-disable-password-auth.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no

  # dnf-automatic's package ships this same path %config(noreplace); installing it
  # first (write_files runs before runcmd's package install) means our values win
  # and the packaged default lands beside it as automatic.conf.rpmnew. Only
  # [commands], [emitters], and [base] apply here: emit_via=stdio never reads
  # [email] or [command] (those back the unused email/exec-command emitters).
  - path: /etc/dnf/automatic.conf
    owner: root:root
    permissions: "0644"
    content: |
      [commands]
      upgrade_type = security
      random_sleep = 0
      network_online_timeout = 60
      download_updates = yes
      apply_updates = yes

      [emitters]
      emit_via = stdio

      [base]
      debuglevel = 1

# cloud-init concatenates every runcmd item into ONE /bin/sh script, so the first
# "set -e" governs everything after it and item order is real execution order.
# The root-password guard comes first because it is a single trivial, order-independent
# command; storage comes first among the substantive tasks: a transient package-install
# failure later must not leave the box without its data volume mounted and populated.
runcmd:
  # Defense in depth against Hetzner's out-of-band root-password injection: when a
  # server is created WITHOUT an --ssh-key, Hetzner mints a one-time root password
  # with a forced-expiry flag that PAM enforces on every SSH session's post-auth
  # chauthtok phase, regardless of `PasswordAuthentication no` (that setting governs
  # only the authentication phase). provision.sh always attaches an SSH key at
  # create time, so Hetzner should never mint that password in the first place —
  # but this clears any forced-expiry state unconditionally and idempotently, so a
  # future rebuild (this box, the Task 7 drill server, any path that ever creates
  # the server without a key by mistake) can never again be blocked on a
  # non-interactive `New password:` prompt. `chage -l` on a fresh AlmaLinux root
  # account with no injected password is a no-op here, not an error.
  - chage -M -1 -I -1 -E -1 -d "$(date +%Y-%m-%d)" root

  # Hetzner by-id links key on the volume's NUMERIC id (scsi-0HC_Volume_<id>), not
  # its name, and that id is not known until the volume attaches. udevadm settle
  # waits for the symlink; the glob must resolve to exactly one device, or this
  # aborts rather than silently formatting the wrong disk. No static mounts:
  # entry: the fstab line is written here, after the UUID is known.
  - |
    set -e
    udevadm settle
    set -- /dev/disk/by-id/scsi-0HC_Volume_*
    if [ "$#" -ne 1 ] || [ ! -b "$1" ]; then
      echo "expected exactly one HC volume device, got $#: $*" >&2
      exit 1
    fi
    DEV=$1
    mkdir -p /srv/music
    if [ -z "$(blkid -o value -s TYPE "$DEV" 2>/dev/null)" ]; then
      mkfs.ext4 -F "$DEV"
    fi
    UUID=$(blkid -o value -s UUID "$DEV")
    FSTAB_LINE="UUID=$UUID /srv/music ext4 defaults,nofail,x-systemd.device-timeout=30s 0 2"
    grep -qxF "$FSTAB_LINE" /etc/fstab || echo "$FSTAB_LINE" >> /etc/fstab
    mount -a
    # mount -a returns 0 even when a nofail device never mounted; without this
    # check the tree below would land on the root disk instead of the volume.
    mountpoint -q /srv/music || { echo "volume not mounted at /srv/music" >&2; exit 1; }

  - |
    set -e
    mkdir -p /srv/music/library /srv/music/inbox /srv/music/review /srv/music/state /srv/music/staging
    chown -R 2000:2000 /srv/music
    chmod 0755 /srv/music/library /srv/music/review /srv/music/state /srv/music/staging
    chmod 2775 /srv/music/inbox
    restorecon -R /srv/music

  # Fixed uid/gid so a later reprovision or restore never renumbers ownership.
  # -M: do not create the home directory here; the /srv/music tree already
  # exists from the block above.
  - |
    set -e
    getent group music >/dev/null || groupadd -g 2000 music
    getent passwd music >/dev/null || useradd -u 2000 -g 2000 -d /srv/music -M -s /usr/sbin/nologin music

  # Docker CE from its own RHEL-family repo, not the AlmaLinux base repos.
  - |
    set -e
    dnf install -y dnf5-plugins || dnf install -y dnf-plugins-core
    dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
    dnf install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
    systemctl enable --now docker

  # automatic.conf above already carries the security-only settings.
  - |
    set -e
    dnf install -y dnf-automatic
    systemctl enable --now dnf-automatic.timer

  # yq (mikefarah/go, v4): music-import (Task 2) shells out to it to turn
  # config/contributors.yaml into JSON for jq. Not in AlmaLinux's repos, so
  # pinned to a specific release and checksum-verified against it rather
  # than trusted from a third-party repo. Version and checksum recorded in
  # docs/STATUS.md; re-verify both there before bumping.
  - |
    set -e
    YQ_VERSION=v4.53.6
    YQ_SHA256=c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385
    curl -LsSf -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
    echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
    install -m 0755 -o root -g root /tmp/yq /usr/local/bin/yq
    rm -f /tmp/yq

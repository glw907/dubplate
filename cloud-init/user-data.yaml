#cloud-config
# dubplate first-boot config for AlmaLinux 10. SELinux ends this boot sequence
# enforcing (global constraint); never `setenforce 0`. Getting there from the
# Hetzner alma-10 image's shipped `SELINUX=permissive` default requires an
# autorelabel + reboot — see the SELinux transition block near the end of
# runcmd and the top-level `power_state` key.

# Only the users listed below are created. Omitting the "default" entry means
# cloud-init does not also create a distro default user.
disable_root: false
ssh_pwauth: false

users:
  - name: root
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGRjkroBDeqUur67LcPZ5KX3uoLm3vzBTfKFVcOBcGxC geoff@907.life

# e2fsprogs provides mkfs.ext4/blkid; present on a full AlmaLinux install
# already, listed here so a minimal image still has the volume-formatting
# tools.
#
# flac, ffmpeg, and rclone are needed on the host too, but are NOT listed
# here: this packages module runs before runcmd, and all three come from
# repos that runcmd enables (EPEL, plus RPM Fusion free for ffmpeg). They're
# installed there instead, right after those repos come up; the runcmd
# comment below records what each one backs and which repo it needs.
packages:
  - e2fsprogs

write_files:
  # cloud-init.service is ordered Before=sshd.service, so this drop-in is already
  # in place the first time sshd starts; no reload needed.
  - path: /etc/ssh/sshd_config.d/60-disable-password-auth.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no

  # dnf-automatic's package ships this same path %config(noreplace); installing it
  # first (write_files runs before runcmd's package install) means our values win
  # and the packaged default lands beside it as automatic.conf.rpmnew. Only
  # [commands], [emitters], and [base] apply here: emit_via=stdio never reads
  # [email] or [command] (those back the unused email/exec-command emitters).
  - path: /etc/dnf/automatic.conf
    owner: root:root
    permissions: "0644"
    content: |
      [commands]
      upgrade_type = security
      random_sleep = 0
      network_online_timeout = 60
      download_updates = yes
      apply_updates = yes

      [emitters]
      emit_via = stdio

      [base]
      debuglevel = 1

# cloud-init concatenates every runcmd item into ONE /bin/sh script, so the first
# "set -e" governs everything after it and item order is real execution order.
# The root-password guard comes first because it is a single trivial, order-independent
# command; storage comes first among the substantive tasks: a transient package-install
# failure later must not leave the box without its data volume mounted and populated.
runcmd:
  # Defense in depth against Hetzner's out-of-band root-password injection: when a
  # server is created WITHOUT an --ssh-key, Hetzner mints a one-time root password
  # with a forced-expiry flag that PAM enforces on every SSH session's post-auth
  # chauthtok phase, regardless of `PasswordAuthentication no` (that setting governs
  # only the authentication phase). provision.sh always attaches an SSH key at
  # create time, so Hetzner should never mint that password in the first place —
  # but this clears any forced-expiry state unconditionally and idempotently, so a
  # future rebuild (this box, the Task 7 drill server, any path that ever creates
  # the server without a key by mistake) can never again be blocked on a
  # non-interactive `New password:` prompt. `chage -l` on a fresh AlmaLinux root
  # account with no injected password is a no-op here, not an error.
  - chage -M -1 -I -1 -E -1 -d "$(date +%Y-%m-%d)" root

  # Hetzner by-id links key on the volume's NUMERIC id (scsi-0HC_Volume_<id>), not
  # its name, and that id is not known until the volume attaches. udevadm settle
  # waits for the symlink; the glob must resolve to exactly one device, or this
  # aborts rather than silently formatting the wrong disk. No static mounts:
  # entry: the fstab line is written here, after the UUID is known.
  - |
    set -e
    udevadm settle
    set -- /dev/disk/by-id/scsi-0HC_Volume_*
    if [ "$#" -ne 1 ] || [ ! -b "$1" ]; then
      echo "expected exactly one HC volume device, got $#: $*" >&2
      exit 1
    fi
    DEV=$1
    mkdir -p /srv/music
    if [ -z "$(blkid -o value -s TYPE "$DEV" 2>/dev/null)" ]; then
      mkfs.ext4 -F "$DEV"
    fi
    UUID=$(blkid -o value -s UUID "$DEV")
    FSTAB_LINE="UUID=$UUID /srv/music ext4 defaults,nofail,x-systemd.device-timeout=30s 0 2"
    grep -qxF "$FSTAB_LINE" /etc/fstab || echo "$FSTAB_LINE" >> /etc/fstab
    mount -a
    # mount -a returns 0 even when a nofail device never mounted; without this
    # check the tree below would land on the root disk instead of the volume.
    mountpoint -q /srv/music || { echo "volume not mounted at /srv/music" >&2; exit 1; }

  - |
    set -e
    mkdir -p /srv/music/library
    chown -R 2000:2000 /srv/music
    chmod 0755 /srv/music/library
    restorecon -R /srv/music

  # Fixed uid/gid so a later reprovision or restore never renumbers ownership.
  # -M: do not create the home directory here; the /srv/music tree already
  # exists from the block above.
  - |
    set -e
    getent group music >/dev/null || groupadd -g 2000 music
    getent passwd music >/dev/null || useradd -u 2000 -g 2000 -d /srv/music -M -s /usr/sbin/nologin music

  # automatic.conf above already carries the security-only settings.
  - |
    set -e
    dnf install -y dnf-automatic
    systemctl enable --now dnf-automatic.timer

  # flac, ffmpeg, and rclone back dubplate-server, and none are in
  # AlmaLinux's BaseOS/AppStream repos: flac (flac -t, metaflac) and ffmpeg
  # are the audio tools for the server's codec work, and rclone is
  # `dubplate-server backup`'s R2 sync. rclone needs nothing beyond EPEL
  # itself, confirmed by a container check (`podman run --rm almalinux:10
  # ...dnf -q list rclone`, 2026-08-31) rather than guessed into this
  # unattended, set -e first boot; flac and ffmpeg additionally need RPM
  # Fusion free, enabled further down. Conductor ruling, 2026-08-30: a
  # pinned static build was rejected for flac/ffmpeg in favor of these
  # repos, because both binaries parse untrusted uploads -- freezing them
  # off dnf-automatic's security-update path would freeze a codec-parsing
  # attack surface right along with them; the same reasoning applies to
  # rclone. dnf-automatic (installed above, already running as a timer)
  # picks up every repo enabled here automatically: it scans whatever is
  # enabled when it fires, not just what was enabled when it was installed.
  #
  # epel-release comes from AlmaLinux's own already-trusted repos, so a
  # plain install verifies fine. RPM Fusion's release package does not: its
  # signature can't be checked against a key dnf doesn't have yet, so the
  # key is fetched and imported over HTTPS first (rpm --import, not
  # `dnf install --nogpgcheck`) and the release package installs against
  # it normally, gpgcheck on throughout. CRB (CodeReady Builder) is enabled
  # in the same block, immediately after epel-release: both EPEL and RPM
  # Fusion lean on packages CRB carries and BaseOS/AppStream don't, and
  # ffmpeg's dependency chain fails outright without it -- which, inside
  # one `set -e` script, would take the SELinux transition below down with
  # it rather than just this block. The dnf plugins package goes in first
  # because it carries `dnf config-manager`.
  #
  # rclone goes in right after epel-release, ahead of the RPM Fusion key
  # import: it needs nothing RPM Fusion or CRB carries, and a failed RPM
  # Fusion step must never take it down with it.
  - |
    set -e
    dnf install -y dnf5-plugins || dnf install -y dnf-plugins-core
    dnf -y install epel-release
    dnf install -y rclone
    dnf config-manager --set-enabled crb
    rpm --import https://download1.rpmfusion.org/free/el/RPM-GPG-KEY-rpmfusion-free-el-10
    dnf install -y https://download1.rpmfusion.org/free/el/rpmfusion-free-release-10.noarch.rpm
    dnf install -y flac ffmpeg

  # SELinux transition: the Hetzner alma-10 image ships /etc/selinux/config
  # with SELINUX=permissive, not the AlmaLinux install-default enforcing
  # (confirmed 2026-08-31 — cloud-init had never touched this file before
  # this block existed, so the permissive value is the image's own choice,
  # not a prior run's regression). Global constraint says enforcing, always;
  # `setenforce 1` alone is rejected here even though it needs no reboot,
  # because it trusts that every file on this vendor-built image already
  # carries the label policy would assign it — permissive mode logs would-be
  # denials but does not require correct labels to boot, so an image built
  # or customized with SELinux off at some stage can carry mislabeled files
  # that only `setenforce 1` would silently misbehave on, invisibly, well
  # after this cloud-init run has reported success. `touch /.autorelabel` +
  # reboot is the documented safe path: early next boot, before any service
  # starts, the SELinux dracut hook relabels every mounted filesystem
  # (including /srv/music) from the loaded policy and reboots itself again
  # automatically once done, then boots normally already enforcing. This is
  # also why the acceptance run must poll patiently past 10 minutes and
  # tolerate SSH dropping twice, not once: our own `power_state` reboot
  # below, then the relabel's own self-triggered second reboot.
  - |
    set -e
    sed -i 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
    grep -qx 'SELINUX=enforcing' /etc/selinux/config
    touch /.autorelabel

# Deliberately the last thing cloud-init does, and a dedicated top-level
# module rather than a `reboot` call inside runcmd above: runcmd's items are
# one concatenated `set -e` script, so triggering a reboot from inside it
# would tear down cloud-init's own process mid-script, before it records
# this run as complete — the next boot would then see an unfinished
# per-instance run and nothing here would enforce "run the rest exactly
# once". `power_state` instead runs strictly after every other module
# (write_files, packages, runcmd) has already finished and had its
# once-per-instance completion recorded, then reboots in the background —
# so `cloud-init status --wait` reports a clean `done` both on this boot and
# after the reboot(s) that follow. `condition: true` is intentional, not a
# placeholder: this boot always requested an autorelabel above, so the
# reboot is unconditionally needed every time, not gated on a state check.
power_state:
  mode: reboot
  message: "dubplate: rebooting for the SELinux autorelabel"
  condition: true

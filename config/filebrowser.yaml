# FileBrowser Quantum (gtstef/filebrowser:1.5.5-stable) config for the
# upload inbox at inbox.907.life. Rsynced onto the box by deploy.sh and
# bind-mounted read-only at /home/filebrowser/data/config.yaml (the image's
# FILEBROWSER_CONFIG default; see the Dockerfile at
# github.com/gtsteffaniak/filebrowser, tag v1.5.5-stable).
#
# This version of FileBrowser Quantum keeps users and their scopes in its
# own SQLite database, not in static YAML — there is no "users:" list here.
# The one source below is configured so that CREATING an account
# automatically scopes it to its own subtree:
#   createUserDir: true + defaultUserScope: "/"
#     -> a user named "alice" gets exactly /srv/music/inbox/alice
# Task 8 creates one FileBrowser account per `contributor`-role entry in
# config/contributors.yaml, using that entry's `name` field as the
# username — the same field music-import's uploader_email() already
# matches against the inbox directory name (docs/HISTORY.md, Task 2 entry).
# Keeping the username and the inbox directory name identical is what makes
# both sides agree without a second mapping table.
server:
  port: 80
  baseURL: "/"
  database: "/home/filebrowser/data/database.db"
  # The default is "tmp", relative to the working directory: outside every
  # bind mount and not writable by UID 2000, so the container crash-loops on
  # "mkdir tmp: permission denied". The data volume below is already both
  # writable and persistent, so the cache belongs under it.
  cacheDir: "/home/filebrowser/data/cache"
  sources:
    - path: "/srv/music/inbox"
      name: "inbox"
      config:
        defaultEnabled: true
        defaultUserScope: "/"
        createUserDir: true
        denyByDefault: true

auth:
  methods:
    password:
      enabled: true
      minLength: 8
      signup: false

# Permissions granted to every newly created account (contributors need to
# drop files and, for a mis-upload, take them back before the next
# music-import run; they never need admin, API, sharing, or realtime).
userDefaults:
  account:
    permissions:
      admin: false
      api: false
      share: false
      realtime: false
      modify: true
      create: true
      delete: true
      download: true

# No admin account is minted here. FileBrowser Quantum creates a first-run
# default on an empty database (see its docs); Task 8 immediately replaces
# it with a real admin account and rotates the password out of band, per
# the spec's "unique password per service" rule for anything Subsonic/
# FileBrowser-adjacent.

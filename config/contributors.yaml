# Navidrome accounts, and the quality-gate notification map. Names and
# emails are config, not secrets; passwords never live here.
#
# `name` IS the contributor's inbox directory name (inbox/<name>/) —
# dubplate's roster matching (internal/config.Roster) matches them as equal
# strings, so display names do not belong here (found live 2026-08-31, in
# the retired shell layer: "Geoff Wright" never matched inbox/geoff, so no
# uploader notice ever sent). The uploader initiative replaces this with
# email-keyed identity.
contributors:

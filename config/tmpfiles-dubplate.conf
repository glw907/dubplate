# dubplate's tmpfiles.d fragment: creates the nudge trigger directory
# under /run, which -- being tmpfs -- does not survive a reboot and must
# be recreated on every boot before dubplate-serve.service or
# dubplate-import-nudge.path can use it.
#
# /run/dubplate is the ONE place this literal path is written (U8's
# plan-time decision): internal/config.Paths.RunDir is env-driven
# (DUBPLATE_RUN_DIR) everywhere in the Go code, and deploy.sh's rendered
# /etc/dubplate/env must set DUBPLATE_RUN_DIR to this same path, so
# `dubplate serve` (which writes nudge trigger files here) and
# `dubplate nudge-consume` (which reads and deletes them) agree with
# what this fragment actually creates.
#
# Deliberately NOT a RuntimeDirectory= on either unit: RuntimeDirectory
# is not reference-counted across units sharing a name (vps-conventions)
# -- the first of dubplate-serve.service and dubplate-import-nudge.service
# to stop would remove a directory the other still needs. A tmpfiles.d
# fragment, activated once at boot via `systemd-tmpfiles --create` (U12a
# installs and runs this), gives both units a directory that outlives
# either one's own lifecycle.
#
# Installed to /etc/tmpfiles.d/dubplate.conf by scripts/deploy.sh (U12a).
#
# Type Path                          Mode UID   GID   Age Argument
d      /run/dubplate                 0750 music music -
d      /run/dubplate/nudge-triggers  0750 music music -

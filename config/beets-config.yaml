# musicbox beets config, installed by scripts/deploy.sh to
# /srv/music/.config/beets/config.yaml (the "music" system user's HOME is
# /srv/music, so beets finds this with no BEETSDIR override needed).
# Mirrors the workstation's own layout and plugin choices
# (~/.dotfiles/beets/.config/beets/config.yaml) repointed at /srv/music, plus
# the quiet-mode section music-import's non-interactive `beet import -q`
# relies on: quiet_fallback/none_rec_action both "skip" send anything beets
# can't confidently tag to review rather than guessing or blocking on input
# that will never come.
directory: /srv/music/library
library: /srv/music/state/library.db

import:
  move: yes
  write: yes
  quiet_fallback: skip
  none_rec_action: skip
  timid: no
  # Group by album tags, not by directory: contributor ZIPs extract FLAT
  # (loose "Artist - Album - NN Track.flac" files), so one staging dir
  # holds many albums. Without this, beets saw the first seed's nine
  # albums as one 135-track candidate and skipped them all (2026-08-31).
  group_albums: yes

# Tag reissues and remasters by their original release year, so a 1993
# album that got remastered in 2015 still sorts as 1993.
original_date: yes
# Multi-disc albums number tracks per disc instead of one long run.
per_disc_numbering: yes

# A query-prefixed key routes any item carrying a non-empty "collection"
# flexible attribute (set by the importer's `--set collection=<c>` for a
# non-default collection) into a "<collection>/" subtree, checked before
# the plain keys below. The default collection's import never sets that
# attribute at all, so its items never match this query and keep today's
# exact, unmigrated layout under the unprefixed keys.
paths:
  collection::.+: $collection/$albumartist/$album%aunique{}/$track $title
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Singles/$artist - $title
  comp: Compilations/$album%aunique{}/$track $title

# musicbrainz must be listed explicitly: since beets 2.4 MusicBrainz is a
# metadata-source plugin, and an explicit plugins line without it leaves
# the autotagger with zero candidate sources (every album "Evaluating 0
# candidates" -> skipped; hit on the first seed, 2026-08-31).
plugins: musicbrainz fetchart embedart replaygain

fetchart:
  auto: yes

replaygain:
  backend: ffmpeg

embedart:
  auto: yes

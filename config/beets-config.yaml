# musicbox beets config, installed by scripts/deploy.sh to
# /srv/music/.config/beets/config.yaml (the "music" system user's HOME is
# /srv/music, so beets finds this with no BEETSDIR override needed).
# Mirrors the workstation's own layout and plugin choices
# (~/.dotfiles/beets/.config/beets/config.yaml) repointed at /srv/music, plus
# the quiet-mode section music-import's non-interactive `beet import -q`
# relies on: quiet_fallback/none_rec_action both "skip" send anything beets
# can't confidently tag to review rather than guessing or blocking on input
# that will never come.
directory: /srv/music/library
library: /srv/music/state/library.db

import:
  move: yes
  write: yes
  quiet_fallback: skip
  none_rec_action: skip
  timid: no

# Tag reissues and remasters by their original release year, so a 1993
# album that got remastered in 2015 still sorts as 1993.
original_date: yes
# Multi-disc albums number tracks per disc instead of one long run.
per_disc_numbering: yes

paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Singles/$artist - $title
  comp: Compilations/$album%aunique{}/$track $title

plugins: fetchart embedart replaygain

fetchart:
  auto: yes

replaygain:
  backend: ffmpeg

embedart:
  auto: yes

title = "dubplate gitleaks config"

# Keep gitleaks' built-in rules rather than replacing them.
[extend]
useDefault = true

[allowlist]
# .claude/worktrees/ holds throwaway git worktrees used by the
# greenfield build's parallel lanes: their tracked files are already
# scanned in their own tree, and walking a second copy from the main
# tree's --no-git leg roughly doubled its wall time in the 2026-09-08
# two-lane run for zero additional coverage. This narrows what the
# scan walks; it loosens no rule.
paths = [
  '''.claude/worktrees/.*''',
]

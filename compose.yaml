# dubplate service stack: Navidrome (streaming), FileBrowser Quantum (the
# upload inbox), and cloudflared (the only way either is reachable from the
# internet — neither service publishes a host port). Every image tag below
# is pinned to a real release, looked up and dated in docs/STATUS.md; no
# `latest`, no auto-updater. Every bind mount carries the SELinux `:Z`
# relabel the box's enforcing SELinux requires (global constraint).
#
# Variable interpolation (${VAR}) is resolved by `docker compose --env-file
# /etc/dubplate/env ...` (see deploy.sh); an unset variable at parse time
# (e.g. on the workstation, before secrets exist) only warns and substitutes
# an empty string, so `docker compose config -q` stays green without real
# secrets present.
#
# name: pins the compose project to "musicbox" explicitly (rewrite plan
# T13): deploy.sh's --project-directory moved from /opt/musicbox to
# /opt/dubplate in this same change, and compose derives an implicit
# project name from that directory's basename when none is pinned — letting
# it float to "dubplate" would make compose treat every existing container
# (musicbox-navidrome-1 etc.) as belonging to a different project and start
# fresh ones alongside them instead of adopting them. Never rename this
# without a supervised box-side migration (stop the stack under the old
# project name first).
name: musicbox

services:
  navidrome:
    image: deluan/navidrome:0.63.2
    restart: unless-stopped
    user: "2000:2000"
    environment:
      ND_CONFIGFILE: /data/navidrome.toml
      # Cron-syntax daily backstop scan; the watcher is disabled
      # (WatcherWait=0s) so a mid-move album is never indexed half-written.
      # Current option names verified against navidrome.org's configuration
      # options page 2026-08-30: Scanner.Schedule / ND_SCANNER_SCHEDULE,
      # Scanner.WatcherWait / ND_SCANNER_WATCHERWAIT.
      ND_SCANNER_SCHEDULE: "0 3 * * *"
      ND_SCANNER_WATCHERWAIT: "0s"
      # Secret: Subsonic token auth forces Navidrome to keep passwords
      # recoverable, so this passphrase must come from the age-store-backed
      # env file, never a literal here.
      ND_PASSWORDENCRYPTIONKEY: ${ND_PASSWORDENCRYPTIONKEY}
      # Spotify agent credentials (artist images in the UI). Secrets, same
      # age-store path as the passphrase above; Navidrome reads these
      # literal names directly.
      ND_SPOTIFY_ID: ${ND_SPOTIFY_ID}
      ND_SPOTIFY_SECRET: ${ND_SPOTIFY_SECRET}
    volumes:
      - /srv/music/library:/music:ro,Z
      - /srv/music/state/navidrome:/data:Z
      - ./config/navidrome.toml:/data/navidrome.toml:ro,Z
    # Loopback publish rather than `expose`: dubplate import runs on the host
    # as the `music` user, outside this compose network, and its scan
    # trigger (internal/beets.TriggerScan) needs the native admin API at
    # localhost:4533. Binding 127.0.0.1 leaves Navidrome as unreachable from
    # the internet as `expose` did; cloudflared remains the only external
    # path in.
    ports:
      - "127.0.0.1:4533:4533"

  filebrowser:
    image: gtstef/filebrowser:1.5.5-stable
    restart: unless-stopped
    user: "2000:2000"
    environment:
      # Secret: FileBrowser's first-run admin bootstrap password. Without it
      # the built-in default fails our own auth.methods.password.minLength: 8
      # policy (config/filebrowser.yaml) and the container crash-loops. Task 8
      # replaces it with per-contributor accounts.
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - /srv/music/inbox:/srv/music/inbox:Z
      - /srv/music/state/filebrowser:/home/filebrowser/data:Z
      - ./config/filebrowser.yaml:/home/filebrowser/data/config.yaml:ro,Z
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    # No local --config: a token-run tunnel is remotely managed, so a local
    # ingress file would be silently ignored (cloudflare/cloudflared issues
    # #633, #933, #1520). The real ingress rules (music.907.life ->
    # navidrome:4533, inbox.907.life -> filebrowser:80, 404 catch-all) are
    # applied against the Cloudflare API once the tunnel exists — see
    # config/cloudflared-tunnel-config.json, applied by Task 5.
    command: tunnel --no-autoupdate run
    environment:
      # Secret: minted when Task 5 creates the named tunnel via the
      # Cloudflare API. Renamed from MUSICBOX_TUNNEL_TOKEN to
      # DUBPLATE_TUNNEL_TOKEN at T13 (same secret value, new variable name).
      TUNNEL_TOKEN: ${DUBPLATE_TUNNEL_TOKEN}
    depends_on:
      - navidrome
      - filebrowser
